<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1760" viewBox="0 0 2400 1760">
<defs><style>.bg{fill:#f8fbff}.title{font:700 38px Arial,sans-serif;fill:#103b66}.sub{font:18px Arial,sans-serif;fill:#55718c}.box{fill:#fff;stroke:#2c6faa;stroke-width:3}.head{fill:#e8f2fb;stroke:#2c6faa;stroke-width:3}.actor{font:700 20px Arial,sans-serif;fill:#17324d}.life{stroke:#8aa0b5;stroke-width:2;stroke-dasharray:10 10}.msg{stroke:#2c6faa;stroke-width:3;fill:none}.return{stroke:#66849d;stroke-width:2.5;stroke-dasharray:10 8;fill:none}.lbl{font:18px Arial,sans-serif;fill:#17324d}.small{font:16px Arial,sans-serif;fill:#4b657d}.note{fill:#fff7df;stroke:#d69a28;stroke-width:2}.alt{fill:#eef6fc;stroke:#9ec0df;stroke-width:2}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2c6faa"/></marker><marker id="rarrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66849d"/></marker></defs>
<rect class="bg" width="2400" height="1760"/><text x="80" y="78" class="title">SEQUENCE DIAGRAM - NEEDS-BASED LAPTOP ASSIGNMENT</text><text x="80" y="112" class="sub">Smart Asset Management System - administrator-confirmed allocation workflow</text>
<g transform="translate(130 160)"><rect class="head" width="250" height="70" rx="14"/><text x="72" y="42" class="actor">Administrator</text></g><g transform="translate(540 160)"><rect class="head" width="300" height="70" rx="14"/><text x="61" y="42" class="actor">Web Application</text></g><g transform="translate(1010 160)"><rect class="head" width="300" height="70" rx="14"/><text x="73" y="42" class="actor">Recommendation Engine</text></g><g transform="translate(1480 160)"><rect class="head" width="250" height="70" rx="14"/><text x="67" y="42" class="actor">MySQL Database</text></g><g transform="translate(1900 160)"><rect class="head" width="250" height="70" rx="14"/><text x="95" y="42" class="actor">Audit Log</text></g>
<path class="life" d="M255 230V1650M690 230V1650M1160 230V1650M1605 230V1650M2025 230V1650"/>
<rect class="note" x="110" y="270" width="640" height="70" rx="12"/><text x="135" y="300" class="lbl">Precondition: administrator is authenticated, authorised, and has a valid CSRF token.</text><text x="135" y="324" class="small">Only active employees and available laptops can be selected.</text>
<path class="msg" marker-end="url(#arrow)" d="M255 395H690"/><text x="325" y="380" class="lbl">1. Enter employee details and work requirements</text><text x="325" y="405" class="small">department, rank, primary work type</text>
<path class="msg" marker-end="url(#arrow)" d="M690 485H1605"/><text x="880" y="470" class="lbl">2. Fetch active employee and available laptop records</text>
<path class="return" marker-end="url(#rarrow)" d="M1605 555H690"/><text x="880" y="542" class="small">employee profile + asset specifications/status</text>
<path class="msg" marker-end="url(#arrow)" d="M690 640H1160"/><text x="785" y="625" class="lbl">3. Derive minimum device profile and rank candidates</text>
<rect class="alt" x="940" y="675" width="440" height="110" rx="12"/><text x="970" y="712" class="lbl">Transparent suitability score</text><text x="970" y="740" class="small">department match + RAM + storage + processor tier</text><text x="970" y="766" class="small">Result is a recommendation, not an automatic allocation.</text>
<path class="return" marker-end="url(#rarrow)" d="M1160 835H690"/><text x="800" y="820" class="small">ranked laptop recommendations with suitability scores</text>
<path class="return" marker-end="url(#rarrow)" d="M690 910H255"/><text x="352" y="895" class="lbl">4. Display ranked recommendations</text>
<path class="msg" marker-end="url(#arrow)" d="M255 1015H690"/><text x="344" y="1000" class="lbl">5. Select a laptop and confirm assignment</text>
<path class="msg" marker-end="url(#arrow)" d="M690 1100H1605"/><text x="853" y="1085" class="lbl">6. Begin transaction; verify employee is active and laptop is available</text>
<rect class="alt" x="480" y="1150" width="1280" height="250" rx="12"/><text x="510" y="1185" class="actor">alt</text><line x1="480" y1="1202" x2="1760" y2="1202" stroke="#9ec0df" stroke-width="2"/><text x="510" y="1238" class="lbl">[Laptop is available]</text><path class="msg" marker-end="url(#arrow)" d="M690 1275H1605"/><text x="850" y="1260" class="small">7. Update user department/rank and set laptop assigned_to + status = Assigned</text><path class="msg" marker-end="url(#arrow)" d="M1605 1320H2025"/><text x="1680" y="1305" class="small">8. Save laptop_history and audit event</text><text x="510" y="1375" class="lbl">[Laptop is no longer available]</text><text x="850" y="1375" class="small">Rollback transaction and return a clear error message.</text></g>
<path class="return" marker-end="url(#rarrow)" d="M1605 1470H690"/><text x="1000" y="1455" class="small">commit confirmed</text><path class="return" marker-end="url(#rarrow)" d="M690 1545H255"/><text x="365" y="1530" class="lbl">9. Show assignment success and refreshed asset status</text>
<rect class="note" x="130" y="1600" width="2070" height="72" rx="12"/><text x="155" y="1630" class="lbl">Control point: the application writes the assignment, lifecycle history, and audit record in one database transaction.</text><text x="155" y="1655" class="small">This prevents a partially saved allocation and preserves accountability for the administrator’s decision.</text>
</svg>
